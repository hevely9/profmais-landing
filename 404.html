<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #0f172a; }
  main { max-width: 440px; text-align: center; }
  .code { font-size: 64px; font-weight: 800; letter-spacing: -.04em; color: #0b1f4d; line-height: 1; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: #475569; margin: 0 0 24px; line-height: 1.5; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #0b1f4d; color: #fff; font-weight: 600; text-decoration: none; margin: 4px; }
  a.alt { background: #fff; color: #0b1f4d; box-shadow: inset 0 0 0 1.5px #e5e9f2; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p id="msg">O endereço pode ter sido digitado errado ou a página foi movida.</p>
  <div id="links"><a href="/">Ir para a página inicial</a></div>
</main>
<script>
  if (location.pathname.indexOf("/clodoaldo/") === 0) {
    document.getElementById("msg").textContent = "Esta página do portal não existe mais ou o link está incompleto.";
    document.getElementById("links").innerHTML = '<a href="/clodoaldo/projetos.html">Ver projetos de lei</a><a class="alt" href="/clodoaldo/">Início do portal</a>';
  }
</script>
</body>
</html>
